<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7C948;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Database cylinder -->
  <ellipse cx="100" cy="60" rx="45" ry="15" fill="#fff" opacity="0.9"/>
  <rect x="55" y="60" width="90" height="60" fill="#fff" opacity="0.9"/>
  <ellipse cx="100" cy="120" rx="45" ry="15" fill="#fff" opacity="0.9"/>
  
  <!-- Lightning bolt (speed) -->
  <path d="M105 65 L90 95 L105 95 L90 125" stroke="url(#grad1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Speed lines -->
  <line x1="130" y1="75" x2="150" y2="75" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="95" x2="155" y2="95" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="115" x2="150" y2="115" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">Tywindb</text>
</svg>
