[package]
name = "tywindb"
version = "0.97.0"
edition = "2021"
description = "A modern, secure, and feature-rich embedded database"
license = "MIT"
authors = ["Paong"]
repository = "https://github.com/farhanturu/tywindb"
homepage = "https://github.com/farhanturu/tywindb"
readme = "README.md"
keywords = ["database", "sql", "embedded", "vector", "document"]
categories = ["database", "embedded"]
rust-version = "1.70"
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "NOTICE",
]

[[bin]]
name = "tywindb"
path = "src/main.rs"

[lib]
name = "tywindb"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Terminal colors and formatting
colored = "2.0"

# Async
tokio = { version = "1.0", features = ["full"] }

# Hashing
blake3 = "1.5"

# Compression
lz4 = "1.24"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Regex (for SQL parsing)
regex = "1.0"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"

# Compression
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
