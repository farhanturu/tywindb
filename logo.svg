<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Database cylinder -->
  <ellipse cx="100" cy="60" rx="45" ry="15" fill="#fff" opacity="0.9"/>
  <rect x="55" y="60" width="90" height="60" fill="#fff" opacity="0.9"/>
  <ellipse cx="100" cy="120" rx="45" ry="15" fill="#fff" opacity="0.9"/>
  
  <!-- Database lines -->
  <ellipse cx="100" cy="75" rx="40" ry="12" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <ellipse cx="100" cy="95" rx="40" ry="12" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <ellipse cx="100" cy="115" rx="40" ry="12" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Lock icon -->
  <rect x="85" y="130" width="30" height="25" rx="3" fill="url(#grad2)"/>
  <path d="M92 130 V120 A8 8 0 0 1 108 120 V130" fill="none" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="142" r="4" fill="#fff"/>
  
  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">Tywindb</text>
</svg>
